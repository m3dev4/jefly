<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votre code de vérification</title>
  </head>
  <body
    style="
      font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, sans-serif;
      line-height: 1.6;
      color: #1f2937;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    "
  >
    <div
      style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; border-radius: 12px 12px 0 0; text-align: center"
    >
      <h1 style="color: white; margin: 0; font-size: 24px">Jëfly</h1>
    </div>
    <div style="background: #f9fafb; padding: 30px; border-radius: 0 0 12px 12px; border: 1px solid #e5e7eb; border-top: none">
      <h2 style="color: #1f2937; margin-top: 0; font-size: 20px">Votre code de vérification</h2>
      <p style="color: #4b5563; font-size: 16px">Bonjour,</p>
      <p style="color: #4b5563; font-size: 16px">Voici votre code de vérification à 6 chiffres :</p>
      <div style="background: white; border: 2px solid #667eea; border-radius: 8px; padding: 20px; text-align: center; margin: 24px 0">
        <span
          style="font-size: 32px; font-weight: bold; color: #667eea; letter-spacing: 8px; font-family: &quot;Courier New&quot;, monospace"
          >{otp_code}</span
        >
      </div>
      <p style="color: #6b7280; font-size: 14px">
        Ce code est valide pendant <strong>{validity_minutes} minutes</strong>. Ne le partagez avec personne.
      </p>
      <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0" />
      <p style="color: #9ca3af; font-size: 12px">Si vous n'avez pas demandé ce code, vous pouvez ignorer cet email.</p>
    </div>
    <div style="text-align: center; margin-top: 20px; color: #9ca3af; font-size: 12px">
      <p>© 2026 Jëfly. Tous droits réservés.</p>
    </div>
  </body>
</html>
